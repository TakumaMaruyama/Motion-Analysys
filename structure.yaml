  lib:
    supabase.ts:
      content: |-
        Supabaseクライアント設定ファイル
        - SupabaseプロジェクトのURLとanon keyを設定
        - Supabaseクライアントインスタンスを作成
        - 認証状態の変更を監視するリスナーを設定
        - ユーザー情報を取得する関数を定義
        agent選定理由: claude-3-5-sonnet-20241022は、Supabaseクライアントの
        設定と初期化、認証関連の処理の実装に優れているため。
      dependency: []
      agent: "claude-3-5-sonnet-20241022"
      api: []
  providers:
    SupabaseProvider.tsx:
      content: |-
        Supabaseクライアントのプロバイダーコンポーネント
        - Supabaseクライアントをコンテキストに格納
        - アプリケーション全体でSupabaseクライアントを利用可能にする
        - 認証状態の変更を監視し、ユーザー情報をコンテキストに反映
        agent選定理由: claude-3-5-sonnet-20241022は、Reactコンテキストの
        利用とSupabaseクライアントの統合に優れているため。
      dependency:
        - src/lib/supabase.ts
      agent: "claude-3-5-sonnet-20241022"
      api: []
    StateProvider.tsx:
      content: |-
        状態管理プロバイダーコンポーネント (Zustand, Recoil, Jotaiのいずれか)
        - グローバルな状態をコンテキストに格納
        - アプリケーション全体で状態を共有・更新可能にする
        - 選択した状態管理ライブラリに応じて実装が異なる
        agent選定理由: claude-3-5-sonnet-20241022は、Reactコンテキストの利用と
        状態管理ライブラリの統合に優れているため。
      dependency: []
      agent: "claude-3-5-sonnet-20241022"
      api: []
  middleware.ts:
    content: |-
      Next.js Middleware
      - 認証が必要なルートへのアクセスを制御
      - 未認証ユーザーをログインページへリダイレクト
      - Supabase Authのセッション情報を確認
      agent選定理由: claude-3-5-sonnet-20241022はNext.js Middlewareの実装と
      Supabase Authとの連携に優れているため。
    dependency:
      - src/lib/supabase.ts
    agent: "claude-3-5-sonnet-20241022"
    api: []
  utils:
    processVideo.ts:
      content: |-
        動画処理関数 (バックエンド)
        - 入力: 動画ファイル (Blob)
        - 出力: ランドマーク付き動画のURL、ランドマークデータ
        - 処理内容:
          1. Supabase Storageに動画をアップロード
          2. MediaPipe Handsで動画を処理:
             - 各フレームのランドマークを抽出
             - ランドマークをフレームに描画
          3. ランドマークデータをSupabase Databaseに保存
          4. 描画済みのフレームを結合して新しい動画を生成 (FFmpeg)
          5. 生成された動画をSupabase Storageに保存
          6. 動画URLとランドマークデータを返す
        - 必要なライブラリ:
          * @supabase/supabase-js
          * @mediapipe/hands
          * ffmpeg (または類似のライブラリ)
        agent選定理由: claude-3-5-sonnet-20241022は、MediaPipe Handsの利用、
        動画処理 (FFmpeg)、Supabase Storage/Databaseとの連携に優れているため。
      dependency:
        - src/lib/supabase.ts
      agent: "claude-3-5-sonnet-20241022"
      api: []